<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../review.css">
<script>window.REVIEW = { video: 'zqx69a', title: 'Talk: Step 3, Visualize It' };</script>
<script src="../config.js"></script>
</head><body>
<div class="wrap">
  <header>
    <h1 id="title">Talk: Step 3, Visualize It<small id="vidname">Loading…</small></h1>
    <label class="hint" for="ver">Version <select id="ver"></select></label>
  </header>
  <div class="grid">
    <section class="stage" aria-label="Player">
      <div class="player"><video id="vid" controls playsinline preload="metadata"></video></div>
      <div class="tc">
        <div class="time" id="time">0:00.00 <span>/ 0:00</span></div>
        <div class="btns">
          <button class="btn" id="back2">−2s</button><button class="btn" id="prevf">−1f</button><button class="btn" id="nextf">+1f</button><button class="btn" id="fwd2">+2s</button>
        </div>
      </div>
      <div class="bar" id="bar" role="slider" aria-label="Timeline with notes" tabindex="0"><div class="fill" id="fill"></div><div class="rng" id="rng" hidden></div><div class="head" id="head"></div></div>
      <div class="row" id="addWide">
        <button class="btn" id="range" aria-pressed="false">Mark a stretch</button>
        <button class="btn primary" id="add">Add note here (N)</button>
      </div>
      <form class="namebox" id="namebox" hidden>
        <label class="hint" for="nm">Your name, so Harrison knows who said what. You only do this once.</label>
        <input type="text" id="nm" autocomplete="name" placeholder="First name">
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="ncancel">Cancel</button><button type="submit" class="btn primary">Continue</button></div>
      </form>
      <form class="composer" id="composer" hidden>
        <div class="at" id="at">At 0:00.00</div>
        <label class="hint" for="txt">What should change?</label>
        <textarea id="txt" placeholder="e.g. Cut this pause. Caption covers his mouth. Card pops in too late."></textarea>
        <div class="tags" id="tags" role="group" aria-label="Type of note"></div>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary" id="save">Save note</button></div>
        <div class="hint kbd">⌘/Ctrl + Enter saves.</div>
      </form>
      <div class="status" id="status" role="status"></div>
    </section>
    <section class="notes" aria-label="Notes">
      <div class="listhead">
        <div class="top"><h2 id="count">Notes</h2>
          <div class="tags" role="group" aria-label="Show"><button class="chip on" data-f="open">Open</button><button class="chip" data-f="all">All</button><button class="chip" data-f="done">Done</button></div>
        </div>
        <div class="people" id="people" hidden></div>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>
<div class="dock" id="dock"><button class="btn" id="rangeM" aria-pressed="false">Stretch</button><button class="btn primary" id="addM">Add note at 0:00.00</button></div>
<script src="../review.js"></script>
</body></html>
